<div class="pin">
  <div class="pin__title">
    <span class="pin__mark">✦</span>
    <h1>Reis Uitgaven</h1>
    <p>Voer de gedeelde pincode in</p>
  </div>

  <div class="pin__bullets" [class.pin__bullets--shake]="fout()">
    @for (gevuld of bullets(); track $index) {
      <span class="pin__bullet" [class.pin__bullet--gevuld]="gevuld"></span>
    }
  </div>

  @if (bezig()) {
    <p class="pin__fout pin__fout--bezig">Even controleren…</p>
  } @else if (foutTekst(); as f) {
    <p class="pin__fout">{{ f }}</p>
  } @else {
    <p class="pin__fout pin__fout--leeg">&nbsp;</p>
  }

  <div class="pin__keys">
    @for (toets of toetsen; track $index) {
      @if (toets === '') {
        <span></span>
      } @else if (toets === 'wis') {
        <button
          type="button"
          class="pin__key pin__key--actie"
          (click)="drukToets(toets)"
          [disabled]="bezig()"
          aria-label="Wis"
        >
          ⌫
        </button>
      } @else {
        <button
          type="button"
          class="pin__key"
          (click)="drukToets(toets)"
          [disabled]="bezig()"
        >
          {{ toets }}
        </button>
      }
    }
  </div>
</div>
